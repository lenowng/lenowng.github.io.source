<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg: #09090b;
        --fg: #ffffff;
        --dot: #a1a1aa;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #09090b;
          --fg: #ffffff;
          --dot: #71717a;
        }
      }
      .bg-box {
        fill: var(--bg);
      }
      .logo-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
        font-weight: 700;
        font-size: 50px;
        letter-spacing: -2px;
        fill: var(--fg);
        text-anchor: middle;
        dominant-baseline: central;
      }
      .logo-dot {
        fill: var(--dot);
      }
    </style>
  </defs>

  <!-- Architectural Rounded Squircle Background -->
  <rect class="bg-box" x="4" y="4" width="120" height="120" rx="30" ry="30" />

  <!-- Monogram Glyph: L . W -->
  <text x="64" y="66" class="logo-text">
    <tspan font-weight="700">L</tspan><tspan class="logo-dot" font-weight="300" font-size="42px">·</tspan><tspan font-weight="300">W</tspan>
  </text>
</svg>
